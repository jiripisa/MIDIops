; PlatformIO project configuration for jp4midi
;
; Two environments share the same core/ sources:
;   env:teensy41  -> firmware for the Teensy 4.1 + ILI9341 display
;   env:native    -> macOS simulator using SDL2 + RtMidi
;
; The architecture rule is enforced by build_src_filter: core/ compiles for
; both targets, but only one platform/ subtree is included per environment.

[platformio]
src_dir = .

; ============================================================
;  Teensy 4.1 firmware
; ============================================================
[env:teensy41]
platform        = teensy
board           = teensy41
framework       = arduino
build_src_filter = -<*> +<core/> +<platform/teensy/>
build_flags     =
    -I${PROJECT_DIR}
    -D USB_MIDI_SERIAL          ; selects "Serial + MIDI" USB type
    -std=gnu++17
build_unflags   =
    -std=gnu++11
    -std=gnu++14
extra_scripts   = pre:scripts/inject_version.py
lib_deps        =
    ; ILI9341_t3n is a fork of ILI9341_t3 that adds off-screen framebuffer
    ; support — required to eliminate flicker on full-screen redraws.
    https://github.com/KurtE/ILI9341_t3n.git
    ; PJRC interrupt-driven rotary encoder library (KY-040 etc.).
    PaulStoffregen/Encoder

; ============================================================
;  macOS simulator (SDL2 + RtMidi)
; ============================================================
[env:native]
platform        = native
build_src_filter = -<*> +<core/> +<platform/host/>
; Build/link flags. The `!cmd` substitution lets PlatformIO pull cflags and
; libs from the Homebrew-installed pkg-config files. Apple frameworks needed
; by RtMidi's CoreMIDI backend are listed explicitly to keep the build
; reproducible even if pkg-config metadata omits them.
build_flags     =
    -std=c++17
    -Wall
    -Wextra
    -DSDL_MAIN_HANDLED
    -I${PROJECT_DIR}
    !sdl2-config --cflags
    !pkg-config --cflags rtmidi
    !sdl2-config --libs
    !pkg-config --libs rtmidi
    -framework CoreMIDI
    -framework CoreAudio
    -framework CoreFoundation
build_unflags   =
extra_scripts   = pre:scripts/inject_version.py
